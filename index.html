:root{
  --bg:#fdf9f4; --card:#f6efe6; --line:#e6d9c9; --field:#fffdfa; --ink:#280d08; --muted:#8c7a70;
  --head:#4a0f1f; --acc:#7b2638; --drop:#7b2638; --ss:#4a0f1f; --soft:#7a4a50; --onhead:#fdf9f4;
  --serif:"Quicksand",ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --sans:"Quicksand",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box; padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--head);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:500;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.btn,.icon-btn,.tab,.chip{font-weight:600}
.num{font-weight:600}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top{position:sticky;top:0;z-index:10;background:var(--head);color:var(--onhead);padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px}
.top-row{display:flex;align-items:center;gap:10px}
.top h1{font-family:var(--serif);font-weight:700;font-size:22px;margin:0;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx{background:none;border:none;color:var(--onhead);opacity:.85;font-size:13px;padding:0;margin-bottom:2px;display:inline-flex;align-items:center;gap:4px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date{font-size:13px;opacity:.8;margin-top:2px}
.icon-btn{background:transparent;border:1px solid color-mix(in srgb,var(--onhead) 45%,transparent);color:var(--onhead);border-radius:10px;height:38px;min-width:38px;padding:0 10px;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.icon-btn.on{background:var(--onhead);color:var(--head)}
.tabs{display:flex;gap:6px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:38px;text-align:center;border:1px solid color-mix(in srgb,var(--onhead) 40%,transparent);background:transparent;color:var(--onhead);border-radius:999px;padding:6px 9px;font-size:13px}
.tab.on{background:var(--onhead);color:var(--head);border-color:var(--onhead)}
main{max-width:620px;margin:0 auto;padding:14px 12px 140px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.ex-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.photo{width:76px;height:76px;border-radius:12px;background:var(--line);flex:0 0 auto;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center;border:none;padding:0}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.ex-name{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.2;margin:2px 0 3px}
.ex-note{font-size:13px;color:var(--soft);white-space:pre-line}
.record{font-size:12px;color:var(--ss);margin-top:4px}
.grid{display:grid;grid-template-columns:62px 1fr 1fr;gap:8px;align-items:center;margin:6px 0}
.grid .lab{font-size:14px}
.colhead{font-size:12px;color:var(--muted);margin-bottom:-2px}
.num{width:100%;height:42px;border:1px solid var(--line);background:var(--field);border-radius:10px;padding:0 10px;font-size:17px;-webkit-appearance:none;appearance:none}
.num::placeholder{color:#b9a89c}
.num.better{border-color:var(--ss);box-shadow:inset 0 0 0 1px var(--ss)}
.drop .lab{color:var(--drop)}
.drop .num{border-color:color-mix(in srgb,var(--drop) 45%,var(--line))}
.ss{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.ss-title{display:flex;align-items:center;gap:10px;color:var(--ss);font-size:14px}
.ss-title .photo{width:44px;height:44px;border-radius:9px}
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:30px;height:30px;border:1px solid var(--acc);border-radius:10px;background:var(--field);display:inline-grid;place-content:center;cursor:pointer;flex:0 0 auto;transition:background .15s}
input[type=checkbox]::after{content:"";width:14px;height:8px;border-left:2.5px solid var(--onhead);border-bottom:2.5px solid var(--onhead);transform:rotate(-45deg) translate(1px,-2px);opacity:0}
input[type=checkbox]:checked{background:var(--acc);border-color:var(--acc)}
input[type=checkbox]:checked::after{opacity:1}
.check input[type=checkbox]{width:26px;height:26px;border-radius:9px}
.drops-row{display:flex;gap:10px;flex-wrap:wrap}
.drop-item{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--drop);font-size:14px;min-width:120px}
.drop-item .ss-check{margin:0}
.ss-check{width:30px;height:30px;accent-color:var(--acc);margin:0 4px 0 auto;flex:0 0 auto}
.ex-foot{display:flex;gap:8px;margin-top:12px}
.btn{border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:10px;height:42px;padding:0 14px;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.fill{background:var(--acc);color:var(--onhead);border-color:var(--acc);flex:1}
.btn.wide{width:100%}
.btn.ghost{border-color:var(--line);color:var(--ink)}
.btn.danger{border-color:#9a3b3b;color:#9a3b3b}
textarea{width:100%;min-height:70px;border:1px solid var(--line);background:var(--field);border-radius:10px;padding:10px;font-size:16px;resize:vertical;margin-top:10px}
.field{display:block;margin:10px 0}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.text{width:100%;height:42px;border:1px solid var(--line);background:var(--field);border-radius:10px;padding:0 10px;font-size:16px}
select.text{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 18px,calc(100% - 13px) 18px;background-size:5px 5px;background-repeat:no-repeat}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;margin:12px 0;font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--acc)}
.order{display:flex;gap:8px;margin-top:12px}
.empty{text-align:center;padding:40px 16px;color:var(--soft)}
.empty h2{font-family:var(--serif);font-weight:600;color:var(--ink);font-size:22px;margin:0 0 6px}
.section-title{font-family:var(--serif);font-weight:700;font-size:19px;margin:6px 2px 12px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.stat{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{font-weight:700;font-size:19px;font-family:var(--serif)}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.hist{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.hist td{padding:7px 2px;border-top:1px solid var(--line)}
.hist td:last-child{text-align:right}
.muted{color:var(--muted);font-size:13px}
.timer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--head);color:var(--onhead);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;transform:translateY(110%);visibility:hidden;transition:transform .25s ease,visibility .25s}
.timer.show{transform:none;visibility:visible}
.timer .t{font-family:var(--serif);font-weight:600;font-size:32px;flex:1;font-variant-numeric:tabular-nums}
.timer.done .t{animation:pulse 1s ease-in-out 3}
@keyframes pulse{50%{opacity:.35}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translate(-50%,-150%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:30;transition:transform .25s ease}
.toast.show{transform:translate(-50%,0)}
.lightbox{position:fixed;inset:0;background:rgba(20,8,5,.88);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
.lightbox img{max-width:100%;max-height:100%;border-radius:12px}
@media (prefers-reduced-motion:reduce){.timer,.toast{transition:none}.timer.done .t{animation:none}}
.sheet-bg{position:fixed;inset:0;background:rgba(40,13,8,.45);z-index:35;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-height:88vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:12px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:620px;margin:0 auto}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-family:var(--serif);font-weight:700;font-size:19px;margin:0 0 4px}
.lbl{font-size:13px;color:var(--muted);margin:16px 0 8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:15px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--onhead)}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:var(--card)}
.opt.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.opt b{font-weight:700;display:block}
.dots{display:flex}.dots i{width:12px;height:12px;border-radius:50%;margin-right:-4px;border:2px solid var(--card)}
.sub{font-size:12px;color:var(--muted)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:none;background:none;padding:9px;border-radius:9px;color:var(--muted);font-weight:600}
.seg button.on{background:var(--field);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.ov{padding:12px}.ov summary{list-style:none;display:flex;justify-content:space-between;align-items:baseline;cursor:pointer}
.ov summary::-webkit-details-marker{display:none}.ov-t{font-weight:700;font-size:16px}
.ov-r{display:grid;gap:4px;padding:5px 0;font-size:13px;align-items:center;border-top:1px solid var(--line)}
.ov-r.hd{border-top:none;margin-top:8px;color:var(--muted);font-size:12px}
.ov-r span:not(:first-child){text-align:center}.ov-r .c1{background:var(--field);border-radius:6px;padding:2px 0;font-weight:700}
.ov-r .n{color:#b9a89c}
.pool-sheet{background:#f3f6f0;padding-top:0}
.pool-head{background:#8a9a82;color:#fdf9f4;margin:0 -16px 0;padding:12px 16px 14px;border-radius:22px 22px 0 0}
.pool-head .grab{background:rgba(253,249,244,.55)}.pool-head h2{color:#fdf9f4}
.pool-sheet .opt{background:#e8eee3;border-color:#d3dccc}
.pool-sheet .chip{background:#e8eee3;border-color:#d3dccc}.pool-sheet .chip.on{background:#6f7f68;border-color:#6f7f68;color:#fdf9f4}
.pool-sheet .btn.ghost{border-color:#d3dccc}
.pool-done{background:#6f7f68!important;border-color:#6f7f68!important}
.grp-t{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#56664f;margin:14px 2px 8px}
.cat-tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--line);color:var(--soft);margin-top:4px}
.plan-row{display:grid;grid-template-columns:1fr 120px;gap:8px;align-items:end}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="main"></main>
<div class="timer" id="timer" role="timer" aria-live="polite">
  <div class="t" id="timerT">1:30</div>
  <button class="icon-btn" id="tPlus">+15 s</button>
  <button class="icon-btn" id="tStop">Stopp</button>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="photoIn" accept="image/*" hidden>
<input type="file" id="importIn" accept="application/json,.json" hidden>
<script>
const PRESETS={
  wein:{name:'Weinrot',head:'#4a0f1f',acc:'#7b2638',drop:'#7b2638',ss:'#4a0f1f',soft:'#7a4a50'},
  gruen:{name:'Artischocke',head:'#586357',acc:'#4b5649',drop:'#5f6b4f',ss:'#3b4339',soft:'#6b7268'},
  cranberry:{name:'Cranberry',head:'#734141',acc:'#6a3a3a',drop:'#8a4b4b',ss:'#5a2a2a',soft:'#86605c'},
  auswertung:{name:'Auswertung',head:'#a05c5c',acc:'#8c4a4a',drop:'#8c4a4a',ss:'#7a3d3d',soft:'#8c6662',hidden:true},
  tanne:{name:'Tannengrün',head:'#14301a',acc:'#586357',drop:'#4a5a3c',ss:'#14301a',soft:'#586357'}
};
const CYCLE=['wein','gruen','cranberry','tanne'];
const LET='ABCDEFGHIJ';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtDate=s=>{const[y,m,d]=s.split('-');return d+'.'+m+'.'+y.slice(2)};
const fmtNum=n=>n==null||isNaN(n)?'':(Math.round(n*100)/100).toLocaleString('de-DE');
const parseNum=v=>{if(v==null)return null;v=String(v).trim().replace(',','.');if(v==='')return null;const n=parseFloat(v);return isNaN(n)?null:n};
const norm=s=>(s||'').trim().toLowerCase();
const live=a=>a.filter(x=>!x.archived);

const store={
  db:null,
  async open(){try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open('trainingsplan',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){this.db=null}},
  async get(k){if(!this.db){try{const v=localStorage.getItem('tp_'+k);return v?JSON.parse(v):undefined}catch(e){return undefined}}
    return new Promise(res=>{const r=this.db.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>res(undefined)})},
  async set(k,v){if(!this.db){try{localStorage.setItem('tp_'+k,JSON.stringify(v))}catch(e){toast('Speicher voll')}return}
    return new Promise(res=>{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=res})},
  async del(k){if(!this.db){try{localStorage.removeItem('tp_'+k)}catch(e){}return}
    return new Promise(res=>{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=res;t.onerror=res})},
  async keys(){if(!this.db){return Object.keys(localStorage).filter(k=>k.startsWith('tp_')).map(k=>k.slice(3))}
    return new Promise(res=>{const r=this.db.transaction('kv').objectStore('kv').getAllKeys();r.onsuccess=()=>res(r.result);r.onerror=()=>res([])})}
};

let S={studios:[],settings:{pause:90,cur:{}},sessions:{}};
let IMG={};
let view={tab:null,edit:false,progKey:null,sheetStudio:null};

function defaultPlans(){return['A','B','C'].map(l=>({id:uid(),name:'Oberkörper '+l,color:'wein',exercises:[]}))
  .concat(['D','E','F'].map(l=>({id:uid(),name:'Beine, Po, Rücken '+l,color:'gruen',exercises:[]})))}
function migrate(oldPlans){return[{id:uid(),name:'Mein Studio',programs:[{id:uid(),name:'Zweier-Split',plans:oldPlans&&oldPlans.length?oldPlans:defaultPlans()}]}]}

const studio=()=>S.studios.find(s=>s.id===S.settings.cur.studio);
const program=()=>{const s=studio();return s&&s.programs.find(p=>p.id===S.settings.cur.program)};
const plans=()=>live(program().plans);
const plan=id=>{for(const st of S.studios)for(const pr of st.programs){const p=pr.plans.find(x=>x.id===id);if(p)return p}return null};
function ensureCur(){S.studios.forEach(s=>{if(!s.pool)s.pool=[]});let st=studio();if(!st||st.archived){st=live(S.studios)[0];S.settings.cur.studio=st.id}
  let pr=program();if(!pr||pr.archived){pr=live(st.programs)[0];if(!pr){pr={id:uid(),name:'Neues Programm',plans:[{id:uid(),name:'Plan A',color:'wein',exercises:[]}]};st.programs.push(pr)}S.settings.cur.program=pr.id}
  if(!live(pr.plans).length)pr.plans.push({id:uid(),name:'Plan A',color:'wein',exercises:[]})}
function allEx(){const o=[];for(const st of S.studios)for(const pr of st.programs)for(const pl of pr.plans)for(const ex of pl.exercises)o.push({ex,pl,pr,st,arch:!!(ex.archived||pl.archived||pr.archived||st.archived)});
  for(const st of S.studios)for(const ex of st.pool||[])o.push({ex,pl:null,pr:null,st,arch:!!st.archived,pool:true});
  for(const st of S.studios)for(const ex of st.trash||[])o.push({ex,pl:null,pr:null,st,arch:true});return o}
function moveEx(ex,dest){for(const st of S.studios){for(const pr of st.programs)for(const pl of pr.plans){const i=pl.exercises.indexOf(ex);if(i>=0)pl.exercises.splice(i,1)}const j=(st.pool||[]).indexOf(ex);if(j>=0)st.pool.splice(j,1)}
  delete ex.archived;if(dest==='pool')studio().pool.push(ex);else plan(dest).exercises.push(ex)}
function doneArr(d,n){return Array.from({length:n},(_,i)=>d===true||(Array.isArray(d)&&!!d[i]))}
function lastSessions(ids,n){const out=[];const ss=sortedSessions();for(let i=ss.length-1;i>=0&&out.length<n;i--){const s=ss[i];
  for(const id of ids){const e=s.data[id];if(e&&(hasVals(e.s)||doneArr(e.dropDone,3).some(Boolean)||e.ssDone)){out.push({date:s.date,e,start:s.planId==='start'});break}}}return out}
function renderPool(){let el=document.getElementById('pool');if(!view.pool){el&&el.remove();return}
  if(!el){el=document.createElement('div');el.id='pool';el.className='sheet-bg';el.dataset.act='closePool';document.body.appendChild(el)}
  const st=studio(),p=plan(view.tab);
  const used=cats().filter(c=>st.pool.some(e=>e.cat===c));const pc=view.poolCat&&view.poolCat!=='all'?view.poolCat:null;
  const groups=[...cats(),''].filter(c=>!pc||c===pc).map(c=>({c,items:st.pool.filter(e=>(e.cat||'')===c||(c===''&&e.cat&&!cats().includes(e.cat)))})).filter(g=>g.items.length);
  const row=ex=>`<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><button class="opt" style="margin:0;flex:1" data-act="takePool" data-v="${ex.id}">
      <span class="photo" style="width:48px;height:48px;border-radius:10px">${ex.img&&IMG[ex.img]?`<img src="${IMG[ex.img]}" alt="">`:''}</span>
      <span style="flex:1;min-width:0"><b>${esc(ex.name)}</b>${ex.note?`<span class="sub" style="display:block">${esc(ex.note)}</span>`:''}</span></button>
      <button class="btn ghost" style="height:40px;padding:0 10px" data-act="delPool" data-v="${ex.id}" aria-label="Löschen">✕</button></div>`;
  el.innerHTML=`<div class="sheet pool-sheet" role="dialog" aria-label="Übungssammlung"><div class="pool-head"><div class="grab"></div><h2>Sammlung</h2>
    <p style="margin:2px 0 0;opacity:.9;font-size:14px">${esc(st.name)}: tippe eine Übung an, um sie zu ${esc(p?p.name:'diesem Plan')} hinzuzufügen.</p></div>
    ${used.length?`<div class="chips" style="margin:14px 0 4px">${catChips('poolCat',view.poolCat,used)}</div>`:''}
    ${groups.length?groups.map(g=>`<div class="grp-t">${g.c?esc(g.c):'Ohne Kategorie'}</div>${g.items.map(row).join('')}`).join(''):'<p class="muted">Die Sammlung ist leer.</p>'}
    <button class="btn wide" style="margin-top:6px" data-act="newPool">Neue Übung in die Sammlung</button>
    <div style="height:8px"></div><button class="btn fill wide pool-done" data-act="closePool">Fertig</button></div>`}
const DEFCATS=['Brust','Schulter','Hintere Schulter','Bizeps','Trizeps','Beine','Po','Latissimus'];
const cats=()=>{if(!Array.isArray(S.settings.cats))S.settings.cats=DEFCATS.slice();return S.settings.cats};
function catChips(act,cur,list){return `<button class="chip ${!cur||cur==='all'?'on':''}" data-act="${act}" data-v="all">Alle</button>`+list.map(c=>`<button class="chip ${cur===c?'on':''}" data-act="${act}" data-v="${esc(c)}">${esc(c)}</button>`).join('')}
function findEx(id){for(const x of allEx())if(x.ex.id===id)return x.ex;return null}
function groupIds(exId){const all=allEx();const me=all.find(x=>x.ex.id===exId);if(!me||!norm(me.ex.name))return[exId];
  return all.filter(x=>x.st.id===me.st.id&&norm(x.ex.name)===norm(me.ex.name)).map(x=>x.ex.id)}

let saveT=null;
function saveData(){clearTimeout(saveT);saveT=setTimeout(saveNow,300)}
function saveNow(){clearTimeout(saveT);return Promise.all([store.set('studios',S.studios),store.set('settings',S.settings),store.set('sessions',S.sessions)])}

function applyTheme(color){const c=PRESETS[color]||PRESETS.wein;const r=document.documentElement.style;
  r.setProperty('--head',c.head);r.setProperty('--acc',c.acc);r.setProperty('--drop',c.drop);r.setProperty('--ss',c.ss);r.setProperty('--soft',c.soft);
  document.querySelector('meta[name=theme-color]').setAttribute('content',c.head)}

function sessionKey(pid){return todayStr()+'|'+pid}
function getEntry(pid,exId,create){const k=sessionKey(pid);
  if(!S.sessions[k]){if(!create)return null;S.sessions[k]={date:todayStr(),planId:pid,data:{}}}
  const d=S.sessions[k].data;if(!d[exId]){if(!create)return null;d[exId]={s:[],d:[],ss:[]}}return d[exId]}
function sortedSessions(){return Object.values(S.sessions).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0)}
function hasVals(arr){return arr&&arr.some(x=>x&&(x[0]!=null||x[1]!=null))}
function lastEntry(ids){const t=todayStr();const ss=sortedSessions();
  for(let i=ss.length-1;i>=0;i--){const s=ss[i];if(s.date>=t)continue;for(const id of ids){const e=s.data[id];if(e&&(hasVals(e.s)||hasVals(e.d)))return e}}return null}
function series(ids){const by={};for(const s of sortedSessions()){for(const id of ids){const e=s.data[id];if(!e)continue;
  for(const x of e.s||[]){if(x&&x[0]!=null&&(by[s.date]==null||x[0]>by[s.date]))by[s.date]=x[0]}}}
  return Object.keys(by).sort().map(d=>({date:d,v:by[d]}))}
function record(ids){const s=series(ids);return s.length?Math.max(...s.map(x=>x.v)):null}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}

function fitTitle(){const el=document.querySelector('.top h1');if(!el)return;let s=22;el.style.fontSize=s+'px';while(el.scrollWidth>el.clientWidth&&s>14){s--;el.style.fontSize=s+'px'}}
window.addEventListener('resize',fitTitle);

const GEAR='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>';
const CHEV='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

function renderTop(){const top=document.getElementById('top');let title,sub='';const pl=plans();
  if(view.tab==='progress'){title='Fortschritt';applyTheme('auswertung')}
  else if(view.tab==='settings'){title='Einstellungen';applyTheme(pl[0].color)}
  else{const p=plan(view.tab);title=p.name;applyTheme(p.color);sub=new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})}
  const isPlan=!['progress','settings'].includes(view.tab);
  top.innerHTML=`<div class="top-row"><div style="flex:1;min-width:0"><button class="ctx" data-act="sheet">${esc(studio().name)}, ${esc(program().name)} ${CHEV}</button><h1>${esc(title)}</h1>${sub?`<div class="date">${esc(sub)}</div>`:''}</div>
    ${isPlan?`<button class="icon-btn ${view.edit?'on':''}" data-act="toggleEdit">${view.edit?'Fertig':'Bearbeiten'}</button>`:''}
    <button class="icon-btn ${view.tab==='settings'?'on':''}" data-act="tab" data-v="settings" aria-label="Einstellungen">${GEAR}</button></div>
    <nav class="tabs">${pl.map((p,i)=>`<button class="tab ${view.tab===p.id?'on':''}" data-act="tab" data-v="${p.id}">${pl.length>4?LET[i]:'Plan '+LET[i]}</button>`).join('')}
    <button class="tab ${view.tab==='progress'?'on':''}" data-act="tab" data-v="progress">Fortschritt</button></nav>`;
  fitTitle()}

function photoHtml(imgId,act,exId){const src=imgId&&IMG[imgId];
  return `<button class="photo" data-act="${act}" data-ex="${exId}" aria-label="Foto">${src?`<img src="${src}" alt="">`:(view.edit?'Foto<br>aufnehmen':'kein<br>Foto')}</button>`}

function setRows(ex,part,count,last,cur,label,cls){let h='';
  for(let i=0;i<count;i++){const l=last&&last[part]&&last[part][i]||[];const c=cur&&cur[part]&&cur[part][i]||[];
    h+=`<div class="grid ${cls}"><span class="lab">${label} ${i+1}</span>
    <input class="num ${c[0]!=null&&l[0]!=null&&c[0]>l[0]?'better':''}" inputmode="decimal" data-ex="${ex.id}" data-p="${part}" data-i="${i}" data-f="0" value="${fmtNum(c[0])}" placeholder="${fmtNum(l[0])}" aria-label="${label} ${i+1} Gewicht">
    <input class="num" inputmode="numeric" data-ex="${ex.id}" data-p="${part}" data-i="${i}" data-f="1" value="${fmtNum(c[1])}" placeholder="${fmtNum(l[1])}" aria-label="${label} ${i+1} Wiederholungen"></div>`}
  return h}

function renderPlan(){const p=plan(view.tab);const list=live(p.exercises);const main=document.getElementById('main');
  if(view.edit){renderEdit(p);return}
  if(!list.length){main.innerHTML=`<div class="empty"><h2>Dieser Plan ist noch leer</h2><p>Leg deine Übungen an, sobald du weißt, welche Geräte es in den Plan schaffen.</p><button class="btn fill" style="flex:none;padding:0 22px" data-act="toggleEdit">Übungen anlegen</button></div>`;return}
  main.innerHTML=list.map(ex=>{const ids=groupIds(ex.id);const last=lastEntry(ids);const cur=getEntry(p.id,ex.id,false);const rec=record(ids);
    let h=`<section class="card"><div class="ex-head">${photoHtml(ex.img,'zoom',ex.id)}
      <div style="flex:1;min-width:0"><div class="ex-name">${esc(ex.name)}</div>${ex.note?`<div class="ex-note">${esc(ex.note)}</div>`:''}${ex.cat?`<span class="cat-tag">${esc(ex.cat)}</span>`:''}
      ${rec!=null?`<div class="record">Rekord ${fmtNum(rec)} kg</div>`:''}</div></div>
      <div class="grid colhead"><span></span><span>kg</span><span>Wdh</span></div>
      ${setRows(ex,'s',ex.sets,last,cur,'Satz','')}`;
    if(ex.drops){const dd=cur&&cur.dropDone;const isDone=i=>dd===true||(Array.isArray(dd)&&!!dd[i]);
      h+=`<div class="ss"><div class="drops-row">${Array.from({length:ex.drops},(_,i)=>`<label class="drop-item"><span>Dropsatz ${i+1}</span>
      <input type="checkbox" class="ss-check" data-dropdone="${ex.id}" data-i="${i}" ${isDone(i)?'checked':''}></label>`).join('')}</div></div>`}
    if(ex.ss){const done=!!(cur&&cur.ssDone);h+=`<div class="ss"><div class="ss-title">${photoHtml(ex.ss.img,'zoomss',ex.id)}<span>Supersatz: ${esc(ex.ss.name)}</span>
      <input type="checkbox" class="ss-check" data-ssdone="${ex.id}" ${done?'checked':''} aria-label="Supersatz erledigt"></div></div>`}
    h+=`<div class="ex-foot"><button class="btn fill" data-act="timer">Pause ${fmtTime(S.settings.pause)}</button>
      <button class="btn" data-act="note" data-ex="${ex.id}">Notiz</button></div>
      <div data-notebox="${ex.id}" hidden><textarea data-note="${ex.id}" placeholder="Sitzhöhe, Griff, Gefühl …">${esc(ex.note||'')}</textarea></div></section>`;
    return h}).join('')+`<p class="muted" style="text-align:center">Graue Zahlen zeigen dein letztes Training in diesem Studio. Alles wird automatisch gespeichert.</p>`}

function selectHtml(attr,val,opts){return `<select class="text" ${attr}>${opts.map(o=>`<option value="${o}" ${o==val?'selected':''}>${o}</option>`).join('')}</select>`}

    <p class="muted" style="text-align:center">Tipp: Gib einer Übung im selben Studio immer denselben Namen, dann laufen ihre Werte über alle Programme in einer Kurve. Entfernte Übungen wandern zurück in die Sammlung, ihr Verlauf bleibt erhalten.</p>`}

function progressItems(){const groups={};for(const x of allEx()){const n=norm(x.ex.name);if(!n)continue;const k=x.st.id+'|'+n;
  if(!groups[k])groups[k]={key:k,st:x.st,name:x.ex.name.trim(),ids:[],color:x.pl?x.pl.color:'wein',active:false};groups[k].ids.push(x.ex.id);if(!x.arch)groups[k].active=true}
  return Object.values(groups).map(g=>(g.n=series(g.ids).length,g)).filter(g=>g.active||g.n)}

function renderProgress(){const mode=view.progMode||'overview';if(mode==='single')renderSingle();else renderOverview();
  const seg=`<div class="seg"><button class="${mode==='overview'?'on':''}" data-act="progMode" data-v="overview">Übersicht</button><button class="${mode==='single'?'on':''}" data-act="progMode" data-v="single">Einzelne Übung</button></div>`;
  document.getElementById('main').insertAdjacentHTML('afterbegin',seg)}
function cell(x){if(!x||(x[0]==null&&x[1]==null))return '<span class="n">–</span>';return `${x[0]!=null?fmtNum(x[0]):'–'}${x[1]!=null?' × '+fmtNum(x[1]):''}`}
function renderOverview(){const main=document.getElementById('main');const pl=plans();const f=view.progFilter||'all';
  const real=Object.values(S.sessions).filter(s=>s.planId!=='start'&&Object.values(s.data).some(e=>hasVals(e.s))).map(s=>s.date).sort();
  let info='Noch kein Training eingetragen';if(real.length){const d=Math.round((new Date(todayStr())-new Date(real[real.length-1]))/864e5);info=d===0?'Letztes Training heute':d===1?'Letztes Training gestern':`Letztes Training vor ${d} Tagen`}
  const cf=view.progCat&&view.progCat!=='all'?view.progCat:null;
  const list=(f==='all'?pl:pl.filter(p=>p.id===f)).flatMap(p=>live(p.exercises).map(ex=>({ex,p,i:pl.indexOf(p)}))).filter(x=>!cf||x.ex.cat===cf);
  const usedCats=cats().filter(c=>pl.some(p=>live(p.exercises).some(e=>e.cat===c)));
  let h=`<p class="muted" style="margin:2px 2px 8px">${info}</p><div class="muted" style="margin:0 2px 6px;font-size:12px">Plan</div><div class="chips" style="margin-bottom:12px"><button class="chip ${f==='all'?'on':''}" data-act="progFilter" data-v="all">Alle</button>
    ${pl.map((p,i)=>`<button class="chip ${f===p.id?'on':''}" data-act="progFilter" data-v="${p.id}">${LET[i]}</button>`).join('')}</div>
    ${usedCats.length?`<div class="muted" style="margin:0 2px 6px;font-size:12px">Kategorie</div><div class="chips" style="margin:0 0 12px">${catChips('progCat',view.progCat,usedCats)}</div>`:''}`;
  if(!list.length)h+=`<div class="empty"><h2>Noch keine Übungen</h2><p>Leg im Bearbeiten-Modus Übungen in deinen Plänen an.</p></div>`;
  for(const {ex,p,i} of list){const L=lastSessions(groupIds(ex.id),3);const col=(PRESETS[p.color]||PRESETS.wein);
    h+=`<details class="card ov" open><summary><span class="ov-t">${esc(ex.name)}</span><span class="sub">${ex.cat?esc(ex.cat)+', ':''}Plan ${LET[i]}</span></summary>`;
    if(!L.length){h+=`<p class="muted" style="margin:8px 0 0">Noch keine Einträge.</p></details>`;continue}
    const cols=L.length;const g=`grid-template-columns:52px repeat(${cols},1fr)`;
    h+=`<div class="ov-r hd" style="${g}"><span></span>${L.map((x,k)=>`<span class="${k===0?'c1':''}">${x.start?'Start':fmtDate(x.date).slice(0,5)}</span>`).join('')}</div>`;
    for(let s=0;s<ex.sets;s++)h+=`<div class="ov-r" style="${g}"><span>Satz ${s+1}</span>${L.map((x,k)=>`<span class="${k===0?'c1':''}">${cell(x.e.s&&x.e.s[s])}</span>`).join('')}</div>`;
    if(ex.drops)h+=`<div class="ov-r" style="${g};color:${col.drop}"><span>Drops</span>${L.map((x,k)=>{const a=doneArr(x.e.dropDone,ex.drops);return `<span class="${k===0?'c1':''}">${a.map(v=>v?'✓':'–').join(' ')}</span>`}).join('')}</div>`;
    if(ex.ss)h+=`<div class="ov-r" style="${g};color:${col.ss}"><span>Super</span>${L.map((x,k)=>`<span class="${k===0?'c1':''}">${x.e.ssDone?'✓':'–'}</span>`).join('')}</div>`;
    h+=`</details>`}
  main.innerHTML=h}
function chartSvg(data,color){const W=340,H=170,pl=36,pr=12,pt=14,pb=26;
  if(data.length<2)return `<p class="muted" style="margin:14px 0">Ab dem zweiten Training siehst du hier deine Kurve.</p>`;
  const vs=data.map(d=>d.v);let mn=Math.min(...vs),mx=Math.max(...vs);if(mn===mx){mn-=1;mx+=1}const pad=(mx-mn)*.12;mn-=pad;mx+=pad;
  const x=i=>pl+(W-pl-pr)*i/(data.length-1),y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  const ticks=[mn+(mx-mn)*.1,(mn+mx)/2,mx-(mx-mn)*.1];
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gewichtsverlauf">`;
  ticks.forEach(t=>{s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="#e6d9c9" stroke-width="1"/><text x="${pl-6}" y="${y(t)+4}" font-size="11" text-anchor="end" fill="#8c7a70">${fmtNum(Math.round(t*2)/2)}</text>`});
  s+=`<polyline fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${data.map((d,i)=>x(i)+','+y(d.v)).join(' ')}"/>`;
  data.forEach((d,i)=>{if(data.length<=20||i===data.length-1)s+=`<circle cx="${x(i)}" cy="${y(d.v)}" r="${i===data.length-1?4.5:3}" fill="${color}"/>`});
  s+=`<text x="${pl}" y="${H-6}" font-size="11" fill="#8c7a70">${fmtDate(data[0].date)}</text><text x="${W-pr}" y="${H-6}" font-size="11" text-anchor="end" fill="#8c7a70">${fmtDate(data[data.length-1].date)}</text></svg>`;
  return s}

function renderSingle(){const main=document.getElementById('main');const items=progressItems();
  const total=Object.values(S.sessions).filter(s=>s.planId!=='start'&&Object.values(s.data).some(e=>hasVals(e.s))).length;
  if(!items.length){main.innerHTML=`<div class="empty"><h2>Noch kein Verlauf</h2><p>Sobald du Übungen angelegt und Gewichte eingetragen hast, wächst hier deine Kurve.</p></div>`;return}
  if(!view.progKey||!items.find(i=>i.key===view.progKey)){const here=items.filter(i=>i.st.id===S.settings.cur.studio);view.progKey=((here.find(i=>i.n)||here[0])||items.find(i=>i.n)||items[0]).key}
  const it=items.find(i=>i.key===view.progKey);const data=series(it.ids);const c=PRESETS[it.color]||PRESETS.wein;
  let opts='';for(const st of S.studios){const g=items.filter(i=>i.st===st);if(g.length)opts+=`<optgroup label="${esc(st.name)}">${g.map(i=>`<option value="${esc(i.key)}" ${i.key===view.progKey?'selected':''}>${esc(i.name)}</option>`).join('')}</optgroup>`}
  let h=`<p class="muted" style="margin:2px 2px 10px">Trainings insgesamt: ${total}</p><section class="card">
    <select class="text" data-act="progSel" aria-label="Übung wählen">${opts}</select><div class="muted" style="margin-top:6px">${esc(it.st.name)}</div>`;
  if(data.length){const first=data[0].v,lastv=data[data.length-1].v,best=Math.max(...data.map(d=>d.v));const pct=first?Math.round((lastv-first)/first*100):0;
    h+=`<div class="stats"><div class="stat"><small>Start</small><b>${fmtNum(first)} kg</b></div><div class="stat"><small>Aktuell</small><b>${fmtNum(lastv)} kg</b></div>
    <div class="stat"><small>Veränderung</small><b style="color:${c.acc}">${pct>0?'+':''}${pct} %</b></div><div class="stat"><small>Rekord</small><b>${fmtNum(best)} kg</b></div></div>
    <div class="muted">Schwerster Arbeitssatz pro Training</div>${chartSvg(data,c.acc)}
    <table class="hist">${data.slice(-8).reverse().map(d=>`<tr><td>${fmtDate(d.date)}</td><td>${fmtNum(d.v)} kg</td></tr>`).join('')}</table>`}
  else h+=`<p class="muted" style="margin-top:14px">Für diese Übung gibt es noch keine Einträge.</p>`;
  main.innerHTML=h+`</section>`}

function render(){ensureCur();if(!['progress','settings'].includes(view.tab)&&!plans().find(p=>p.id===view.tab))view.tab=plans()[0].id;
  renderTop();if(view.tab==='progress')renderProgress();else if(view.tab==='settings')renderSettings();else renderPlan();renderSheet()}

function fmtTime(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
let tEnd=0,tInt=null,wake=null,actx=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(o=>{const os=actx.createOscillator(),g=actx.createGain();os.frequency.value=880;os.connect(g);g.connect(actx.destination);
  const t=actx.currentTime+o;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.4,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.25);os.start(t);os.stop(t+.3)})}catch(e){}}
async function startTimer(sec){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}
  tEnd=Date.now()+sec*1000;const el=document.getElementById('timer');el.classList.add('show');el.classList.remove('done');tick();clearInterval(tInt);tInt=setInterval(tick,250);
  try{if('wakeLock' in navigator&&!wake)wake=await navigator.wakeLock.request('screen')}catch(e){}}
function tick(){const left=Math.max(0,Math.round((tEnd-Date.now())/1000));document.getElementById('timerT').textContent=left?fmtTime(left):'Weiter geht’s';
  if(!left){clearInterval(tInt);document.getElementById('timer').classList.add('done');beep();setTimeout(stopTimer,6000)}}
function stopTimer(){clearInterval(tInt);document.getElementById('timer').classList.remove('show','done');try{wake&&wake.release()}catch(e){}wake=null}
document.getElementById('tPlus').onclick=()=>{tEnd=Math.max(tEnd,Date.now())+15000;document.getElementById('timer').classList.remove('done');clearInterval(tInt);tInt=setInterval(tick,250);tick()};
document.getElementById('tStop').onclick=stopTimer;

let photoTarget=null;
function resizeImage(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const max=640;let w=im.width,h=im.height;const sc=Math.min(1,max/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);res(cv.toDataURL('image/jpeg',.78))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
document.getElementById('photoIn').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f||!photoTarget)return;
  try{const data=await resizeImage(f);const id='img_'+uid();IMG[id]=data;await store.set('img:'+id,data);
    const ex=findEx(photoTarget.ex);const obj=photoTarget.ss?ex.ss:ex;if(obj.img){delete IMG[obj.img];store.del('img:'+obj.img)}obj.img=id;saveData();render()}catch(err){toast('Foto konnte nicht geladen werden')}});

async function dupImg(id){if(!id||!IMG[id])return null;const n='img_'+uid();IMG[n]=IMG[id];await store.set('img:'+n,IMG[n]);return n}
async function copyProgram(pr,target){const np={id:uid(),name:pr.name,plans:[]};
  for(const p of live(pr.plans)){const q={id:uid(),name:p.name,color:p.color,exercises:[]};
    for(const ex of live(p.exercises)){q.exercises.push({id:uid(),name:ex.name,note:ex.note,sets:ex.sets,drops:ex.drops,img:await dupImg(ex.img),ss:ex.ss?{name:ex.ss.name,img:await dupImg(ex.ss.img)}:null})}
    np.plans.push(q)}target.programs.push(np);return np}
function hasHistory(pl){return pl.exercises.some(ex=>series([ex.id]).length)||Object.values(S.sessions).some(s=>s.planId===pl.id)}

async function doExport(){await saveNow();const data={app:'trainingsplan',version:2,exported:new Date().toISOString(),studios:S.studios,settings:S.settings,sessions:S.sessions,images:IMG};
  const name='trainingsplan-backup-'+todayStr()+'.json';const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  try{const file=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Trainingsplan Backup'});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
document.getElementById('importIn').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const d=JSON.parse(await f.text());
    if(d.app==='trainingsplan-sammlung'){const st=studio();if(!confirm(`${d.exercises.length} Übungen mit Fotos und Startwerten in die Sammlung von „${st.name}“ hinzufügen?`))return;
      for(const[k,v]of Object.entries(d.images||{})){IMG[k]=v;await store.set('img:'+k,v)}
      for(const ex of d.exercises){const old=findEx(ex.id);if(!old)st.pool.push(ex);else{old.name=ex.name;old.note=ex.note;if(ex.img)old.img=ex.img;if(ex.cat&&!old.cat)old.cat=ex.cat}}
      for(const[k,s]of Object.entries(d.sessions||{})){if(!S.sessions[k])S.sessions[k]=s;else for(const[id,e]of Object.entries(s.data))if(!S.sessions[k].data[id])S.sessions[k].data[id]=e}
      await saveNow();render();toast('Übungen sind in der Sammlung');return}
    if(d.app!=='trainingsplan'||!(Array.isArray(d.studios)||Array.isArray(d.plans)))throw 0;
    if(!confirm('Backup wiederherstellen? Die aktuellen Daten auf diesem Handy werden ersetzt.'))return;
    for(const k of await store.keys())if(String(k).startsWith('img:'))await store.del(k);
    S.studios=d.studios||migrate(d.plans);S.settings=Object.assign({pause:90,cur:{}},d.settings||{});if(!S.settings.cur)S.settings.cur={};S.sessions=d.sessions||{};IMG=d.images||{};
    for(const[k,v]of Object.entries(IMG))await store.set('img:'+k,v);ensureCur();await saveNow();view.tab=null;render();toast('Backup wiederhergestellt')}
  catch(err){toast('Diese Datei ist kein gültiges Backup')}});

document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT')return;
  if((b.dataset.act==='closeSheet'||(b.dataset.act==='closePool'&&b.id==='pool'))&&e.target!==b)return;
  const a=b.dataset.act,exId=b.dataset.ex,v=b.dataset.v;const p=plan(view.tab);const pr=program(),st=studio();
  if(a==='tab'){view.tab=v;view.edit=false;render();scrollTo(0,0)}
  else if(a==='toggleEdit'){view.edit=!view.edit;if(!view.edit){p.exercises.forEach(x=>{if(!x.name.trim())x.name='Neue Übung'});saveData()}render();scrollTo(0,0)}
  else if(a==='add'){p.exercises.push({id:uid(),name:'',note:'',sets:3,drops:0,ss:null,img:null});saveData();render();
    const ins=document.querySelectorAll('[data-e="name"]');const last=ins[ins.length-1];last&&last.focus();last&&last.scrollIntoView({block:'center'})}
  else if(a==='up'||a==='down'){const arr=p.exercises;const act=live(arr);const i=act.findIndex(x=>x.id===exId);const j=a==='up'?i-1:i+1;if(j<0||j>=act.length)return;
    const ia=arr.indexOf(act[i]),ib=arr.indexOf(act[j]);[arr[ia],arr[ib]]=[arr[ib],arr[ia]];saveData();render()}
  else if(a==='remove'){const ex=findEx(exId);if(!confirm(`„${ex.name||'Übung'}“ aus dem Plan nehmen? Sie kommt zurück in die Sammlung, der Verlauf bleibt erhalten.`))return;
    moveEx(ex,'pool');saveData();render()}
  else if(a==='progMode'){view.progMode=v;renderProgress()}
  else if(a==='progFilter'){view.progFilter=v;renderProgress()}
  else if(a==='poolCat'){view.poolCat=v;renderPool()}
  else if(a==='progCat'){view.progCat=v;renderProgress()}
  else if(a==='addCat'){const n=(prompt('Name der neuen Kategorie')||'').trim();if(!n||cats().includes(n))return;cats().push(n);saveData();render()}
  else if(a==='delCat'){const c=cats()[+v];if(!confirm(`Kategorie „${c}“ entfernen? Die Übungen bleiben erhalten, nur ohne Kategorie.`))return;cats().splice(+v,1);allEx().forEach(x=>{if(x.ex.cat===c)x.ex.cat=''});saveData();render()}
  else if(a==='newPool'){const ex={id:uid(),name:'Neue Übung',note:'',sets:3,drops:0,ss:null,img:null,cat:''};st.pool.push(ex);saveData();view.pool=false;renderPool();render();toast('In der Sammlung angelegt, jetzt im Plan bearbeiten');return}
  else if(a==='openPool'){view.pool=true;renderPool()}
  else if(a==='closePool'){view.pool=false;renderPool();render()}
  else if(a==='takePool'){const ex=st.pool.find(x=>x.id===v);if(!ex)return;st.pool.splice(st.pool.indexOf(ex),1);delete ex.archived;p.exercises.push(ex);saveData();renderPool();toast(`„${ex.name}“ hinzugefügt`)}
  else if(a==='delPool'){const ex=st.pool.find(x=>x.id===v);if(!ex||!confirm(`„${ex.name}“ aus der Sammlung löschen? Ein vorhandener Verlauf bleibt im Fortschritt.`))return;
    st.pool.splice(st.pool.indexOf(ex),1);if(lastSessions([ex.id],1).length){ex.archived=true;(st.trash=st.trash||[]).push(ex)}saveData();renderPool()}
  else if(a==='photo'||a==='photoss'){photoTarget={ex:exId,ss:a==='photoss'};document.getElementById('photoIn').click()}
  else if(a==='zoom'||a==='zoomss'){const ex=findEx(exId);const id=a==='zoom'?ex.img:ex.ss&&ex.ss.img;if(!id||!IMG[id])return;
    const lb=document.createElement('div');lb.className='lightbox';lb.innerHTML=`<img src="${IMG[id]}" alt="">`;lb.onclick=()=>lb.remove();document.body.appendChild(lb)}
  else if(a==='timer'){startTimer(S.settings.pause)}
  else if(a==='note'){const box=document.querySelector(`[data-notebox="${exId}"]`);box.hidden=!box.hidden;if(!box.hidden)box.querySelector('textarea').focus()}
  else if(a==='export'){doExport()}
  else if(a==='import'){document.getElementById('importIn').click()}
  else if(a==='sheet'){view.sheetStudio=st.id;renderSheet()}
  else if(a==='closeSheet'){view.sheetStudio=null;renderSheet()}
  else if(a==='sheetStudio'){view.sheetStudio=v;renderSheet()}
  else if(a==='pickProg'){S.settings.cur={studio:view.sheetStudio,program:v};view.sheetStudio=null;view.edit=false;view.tab=null;saveData();render();scrollTo(0,0)}
  else if(a==='newProg'){const name=document.getElementById('newProgName').value.trim()||'Neues Programm';const n=+document.getElementById('newProgCount').value;
    const target=S.studios.find(s=>s.id===view.sheetStudio);const np={id:uid(),name,plans:[]};for(let i=0;i<n;i++)np.plans.push({id:uid(),name:'Plan '+LET[i],color:CYCLE[i%CYCLE.length],exercises:[]});
    target.programs.push(np);S.settings.cur={studio:target.id,program:np.id};view.sheetStudio=null;view.tab=null;view.edit=true;saveData();render();toast('Programm angelegt, jetzt Übungen eintragen')}
  else if(a==='addStudio'){const name=(prompt('Name des Studios')||'').trim();if(!name)return;
    const ns={id:uid(),name,programs:[]};S.studios.push(ns);await copyProgram(pr,ns);saveData();
    if(view.sheetStudio){view.sheetStudio=ns.id;renderSheet()}else render();toast(`„${pr.name}“ wurde als Vorlage übernommen`)}
  else if(a==='delStudio'){const s=S.studios.find(x=>x.id===v);if(!confirm(`Studio „${s.name}“ entfernen? Der Verlauf bleibt im Fortschritt erhalten.`))return;
    s.archived=true;saveData();render()}
  else if(a==='addPlan'){const n=live(pr.plans).length;pr.plans.push({id:uid(),name:'Plan '+LET[n],color:CYCLE[n%CYCLE.length],exercises:[]});saveData();render()}
  else if(a==='delPlan'){const pl=plan(b.dataset.p);if(!confirm(`„${pl.name}“ entfernen? Der Verlauf bleibt erhalten.`))return;
    if(hasHistory(pl))pl.archived=true;else pr.plans.splice(pr.plans.indexOf(pl),1);saveData();render()}
  else if(a==='delProg'){if(live(st.programs).length<2){toast('Ein Studio braucht mindestens ein Programm');return}
    if(!confirm(`Programm „${pr.name}“ entfernen? Der Verlauf bleibt erhalten.`))return;pr.archived=true;S.settings.cur.program=null;view.tab='settings';saveData();render()}
  else if(a==='copyProg'){const t=S.studios.find(s=>s.id===document.getElementById('copyTarget').value);await copyProgram(pr,t);saveData();toast(`Kopiert nach „${t.name}“`)}
});

document.addEventListener('input',e=>{const t=e.target;
  if(t.classList.contains('num')){const v=parseNum(t.value);const en=getEntry(view.tab,t.dataset.ex,true);const arr=en[t.dataset.p];const i=+t.dataset.i;arr[i]=arr[i]||[null,null];arr[i][+t.dataset.f]=v;
    if(t.dataset.f==='0'){const ph=parseNum(t.placeholder);t.classList.toggle('better',v!=null&&ph!=null&&v>ph)}saveData()}
  else if(t.dataset.note){findEx(t.dataset.note).note=t.value;saveData()}
  else if(t.dataset.e==='name'||t.dataset.e==='ssName'){const ex=findEx(t.dataset.ex);if(t.dataset.e==='name')ex.name=t.value;else ex.ss.name=t.value;saveData()}
  else if(t.dataset.s==='pname'){plan(t.dataset.p).name=t.value;saveData()}
  else if(t.dataset.s==='prname'){program().name=t.value;saveData()}
  else if(t.dataset.s==='stname'){S.studios.find(s=>s.id===t.dataset.v).name=t.value;saveData()}});

document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.e){const ex=findEx(t.dataset.ex);const k=t.dataset.e;
    if(k==='sets')ex.sets=+t.value;else if(k==='drops')ex.drops=+t.value;
    else if(k==='cat'){ex.cat=t.value;saveData();return}
    else if(k==='move'){if(!t.value)return;const dest=t.value;moveEx(ex,dest);saveData();render();toast(dest==='pool'?'In die Sammlung verschoben':'Verschoben nach Plan '+LET[plans().indexOf(plan(dest))]);return}
    else if(k==='ssOn'){if(t.checked){ex.ss=ex._ss||{name:'',img:null};delete ex._ss}else{ex._ss=ex.ss;ex.ss=null}}
    else return;saveData();if(k==='ssOn')render()}
  else if(t.dataset.s==='pcolor'){plan(t.dataset.p).color=t.value;saveData();render()}
  else if(t.dataset.s==='catname'){const i=+t.dataset.i,old=cats()[i],n=t.value.trim();if(!n||n===old)return;cats()[i]=n;allEx().forEach(x=>{if(x.ex.cat===old)x.ex.cat=n});saveData()}
  else if(t.dataset.s==='pause'){S.settings.pause=+t.value;saveData()}
  else if(['prname','stname','pname'].includes(t.dataset.s)){renderTop()}
  else if(t.dataset.act==='progSel'){view.progKey=t.value;renderProgress()}
  else if(t.dataset.dropdone){const en=getEntry(view.tab,t.dataset.dropdone,true);if(!Array.isArray(en.dropDone))en.dropDone=[];en.dropDone[+t.dataset.i]=t.checked;saveData()}
  else if(t.dataset.ssdone){getEntry(view.tab,t.dataset.ssdone,true).ssDone=t.checked;saveData()}});

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveNow()});
window.addEventListener('pagehide',()=>saveNow());

(async function init(){await store.open();
  S.studios=await store.get('studios');if(!S.studios)S.studios=migrate(await store.get('plans'));
  S.settings=Object.assign({pause:90,cur:{}},await store.get('settings')||{});if(!S.settings.cur)S.settings.cur={};
  S.sessions=await store.get('sessions')||{};
  for(const x of allEx()){for(const id of [x.ex.img,x.ex.ss&&x.ex.ss.img]){if(id&&!IMG[id]){const d=await store.get('img:'+id);if(d)IMG[id]=d}}}
  ensureCur();saveNow();render();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
})();
</script>
